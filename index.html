<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基本電學第10章</title>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)'], ['$', '$']],
                displayMath: [['$$', '$$']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/dist/browser.js"></script>
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --important: #ff0000;
            --card-bg: #111111;
            --border: #333333;
            --btn-bg: #222222;
            --btn-hover: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 0px;
            border: 1px solid var(--border);
            margin-top: 20px;
            box-sizing: border-box;
        }
        .timer-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 24px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }
        .timer-controls button {
            background: var(--btn-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            margin-left: 5px;
            cursor: pointer;
        }
        .timer-controls button:hover {
            background: var(--btn-hover);
        }
        .mode-select, .quiz-section, .result-section { display: none; }
        .active { display: block; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: var(--btn-bg);
            color: var(--text);
            border: 1px solid var(--border);
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--btn-hover); }
        .btn-center { text-align: center; }
        .important-text {
            color: var(--important);
            font-weight: bold;
        }
        .hint {
            padding: 12px;
            margin: 10px 0;
            border: 1px solid var(--border);
            font-weight: bold;
            display: none;
        }
        .hint.correct { border-color: #00ff00; color: #00ff00; display: block; }
        .hint.wrong { border-color: var(--important); color: var(--important); display: block; }
        .progress-bar {
            height: 4px;
            background: #222222;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-fill { height: 100%; background: var(--important); width: 0%; transition: width 0.3s; }
        .latex-box {
            background: #050505;
            border: 1px solid var(--border);
            padding: 15px;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--important);
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
    </style>
</head>
<body>

    <div class="timer-banner">
        <div><span id="timer-label">專注時間</span>: <span id="time-display" style="font-family: monospace; font-size: 18px; font-weight: bold;">25:00</span></div>
        <div class="timer-controls">
            <button onclick="toggleTimer()">暫停/開始</button>
            <button onclick="resetTimer()">重設25分</button>
            <button onclick="skipTimer()">關閉/跳過</button>
        </div>
    </div>

    <div class="container">
        <div id="menu-view" class="mode-select active">
            <h2 style="text-align: center; margin-bottom: 30px;">基本電學第10章：期末考</h2>
            <button class="btn btn-center" onclick="startQuiz(1)">模式 1：步驟拆解·下一步驟選擇</button>
            <p style="color:#888888; font-size:14px; margin-top:-5px; margin-bottom:20px; padding-left:10px;">給予完整題目，逐步選擇正確的解題思路與邏輯。</p>
            
            <button class="btn btn-center" onclick="startQuiz(2)">模式 2：核心公式·全流程速配</button>
            <p style="color:#888888; font-size:14px; margin-top:-5px; margin-bottom:20px; padding-left:10px;">直接切入核心，從選項中找出該題所對應的關鍵 LaTeX 公式與最終答案。</p>
        </div>

        <div id="quiz-view" class="quiz-section">
            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
            <div style="display: flex; justify-content: space-between; color: #888888; font-size: 14px;">
                <span id="question-index">題目 1 / 7</span>
                <span id="score-track">正確率: 100%</span>
            </div>
            <h3 id="question-title" style="margin-top: 15px;"></h3>
            <div class="latex-box" id="question-content"></div>
            
            <div id="options-container"></div>
            <div id="feedback-hint" class="hint"></div>
            <button id="next-btn" class="btn btn-center" style="border-color: var(--important); display:none;" onclick="nextQuestion()">下一題</button>
        </div>

        <div id="result-view" class="result-section" style="text-align: center;">
            <h2>測試完成</h2>
            <div style="font-size: 48px; font-weight: bold; color: var(--important); margin: 20px 0;" id="accuracy-rate">0%</div>
            <p id="result-comment" style="font-size: 18px; margin-bottom: 30px;"></p>
            <button class="btn btn-center" style="border-color:#00ff00;" onclick="retryWrongQuestions()" id="retry-wrong-btn">錯題重新挑戰</button>
            <button class="btn btn-center" style="border-color:#888888;" onclick="backToMenu()">回到主選單</button>
        </div>
    </div>

    <div id="break-modal" class="modal">
        <div class="modal-content">
            <h2 class="important-text">專注時間結束</h2>
            <p style="font-size:16px; color:#bbbbbb;">請強制要求停止 5 分鐘進行大腦休息。</p>
            <div style="font-size:36px; font-weight:bold; margin:20px 0; font-family:monospace;" id="break-time-display">05:00</div>
            <button class="btn btn-center" style="border-color:var(--important);" onclick="closeBreakModal()">提早解除強制休息</button>
        </div>
    </div>

    <script>
        // 核心題庫：完整 LaTeX 格式封裝
        const allQuestions = [
            {
                id: 1,
                title: "例題 10-2 平均功率",
                desc: "某單相交流電路，若電源電壓與電路電流分別為 $v(t) = 50\\sqrt{2}\\sin(377t + 30^{\\circ})\\text{ V}$，$i(t) = 5\\sqrt{2}\\sin(377t - 30^{\\circ})\\text{ A}$，則此電路之平均功率 $P$ 為何？",
                mode1_steps: [
                    { q: "步驟一：如何將電壓與電流轉為有效值相量形式？", a: ["$\\bar{V} = 50\\angle 30^{\\circ}\\text{ V}, \\bar{I} = 5\\angle -30^{\\circ}\\text{ A}$", "$\\bar{V} = 50\\sqrt{2}\\angle 30^{\\circ}\\text{ V}, \\bar{I} = 5\\sqrt{2}\\angle -30^{\\circ}\\text{ A}$"], correct: 0 },
                    { q: "步驟二：如何計算相位角差 $\\theta$？", a: ["$\\theta = \\theta_v - \\theta_i = 30^{\\circ} - (-30^{\\circ}) = 60^{\\circ}$", "$\\theta = \\theta_v - \\theta_i = 30^{\\circ} - 30^{\\circ} = 0^{\\circ}$"], correct: 0 },
                    { q: "步驟三：帶入平均功率公式求出最終答案？", a: ["$P = VI\\cos\\theta = 50 \\times 5 \\times \\cos 60^{\\circ} = 125\\text{ W}$", "$P = VI = 50 \\times 5 = 250\\text{ W}$"], correct: 0 }
                ],
                mode2_match: {
                    q: "請選擇正確的計算過程公式與答案：",
                    a: [
                        "$P = VI\\cos\\theta = 50 \\times 5 \\times \\cos 60^{\\circ} = 125\\text{ W}$",
                        "$P = VI\\sin\\theta = 50 \\times 5 \\times \\sin 60^{\\circ} = 125\\sqrt{3}\\text{ VAR}$",
                        "$P = VI = 50 \\times 5 = 250\\text{ W}$"
                    ],
                    correct: 0
                }
            },
            {
                id: 2,
                title: "例題 10-3 純電阻電路之電功率",
                desc: "如圖 10-10 所示之純電阻交流電路，若負載 $R = 50\\ \\Omega$，當接於 $v(t) = 100\\sqrt{2}\\sin(377t)\\text{ V}$ 電源電壓時，試求該電路之 (1) $\\theta$ (2) $P$ (3) $P_{\\max}$ (4) $P_{\\min}$ (5) $f_p$。",
                mode1_steps: [
                    { q: "步驟一：求出純電阻電路之電壓與電流相位角差 $\\theta$？", a: ["$\\theta = \\theta_v - \\theta_i = 0^{\\circ} - 0^{\\circ} = 0^{\\circ}$", "$\\theta = 90^{\\circ}$"], correct: 0 },
                    { q: "步驟二：求出有效值電流 $\\bar{I}$ 與平均功率 $P$？", a: ["$\\bar{I} = 2\\angle 0^{\\circ}\\text{ A} \\rightarrow P = VI\\cos\\theta = 100 \\times 2 \\times \\cos 0^{\\circ} = 200\\text{ W}$", "$\\bar{I} = 2\\sqrt{2}\\angle 0^{\\circ}\\text{ A} \\rightarrow P = 400\\text{ W}$"], correct: 0 },
                    { q: "步驟三：求出最大與最小瞬時功率 $P_{\\max}$ , $P_{\\min}$？", a: ["$P_{\\max} = VI(\\cos\\theta + 1) = 400\\text{ W}, P_{\\min} = VI(\\cos\\theta - 1) = 0\\text{ W}$", "$P_{\\max} = 200\\text{ W}, P_{\\min} = -200\\text{ W}$"], correct: 0 },
                    { q: "步驟四：求出功率之頻率 $f_p$？", a: ["$f = \\frac{377}{2\\pi} = 60\\text{ Hz} \\rightarrow f_p = 2f = 120\\text{ Hz}$", "$f_p = f = 60\\text{ Hz}$"], correct: 0 }
                ],
                mode2_match: {
                    q: "請選擇純電阻電路完整的答案鏈組合：",
                    a: [
                        "$\\theta = 0^{\\circ}, P = 200\\text{ W}, P_{\\max} = 400\\text{ W}, P_{\\min} = 0\\text{ W}, f_p = 120\\text{ Hz}$",
                        "$\\theta = 0^{\\circ}, P = 200\\text{ W}, P_{\\max} = 200\\text{ W}, P_{\\min} = -200\\text{ W}, f_p = 60\\text{ Hz}$",
                        "$\\theta = 90^{\\circ}, P = 0\\text{ W}, P_{\\max} = 400\\text{ W}, P_{\\min} = -400\\text{ W}, f_p = 120\\text{ Hz}$"
                    ],
                    correct: 0
                }
            },
            {
                id: 3,
                title: "例題 10-4 視在功率",
                desc: "某單相交流電路，當接於 $\\bar{V} = 10\\angle 60^{\\circ}\\text{ V}$ 電源電壓時，若產生電源電流 $\\bar{I} = 10\\angle 15^{\\circ}\\text{ A}$，問該電路之視在功率 $S$ 為何？",
                mode1_steps: [
                    { q: "步驟一：求視在功率 $S$ 是否需要導入角度運算？", a: ["不需要，直接將電壓與電流有效值大小相乘 $S = VI$", "需要，必須帶入角度相減計算虛功"], correct: 0 }
                ],
                mode2_match: {
                    q: "請選擇正確的計算過程公式與答案：",
                    a: [
                        "$S = VI = 10 \\times 10 = 100\\text{ VA}$",
                        "$S = VI\\cos(60^{\\circ}-15^{\\circ}) = 50\\sqrt{2}\\text{ VA}$",
                        "$S = \\frac{V}{I} = 1\\angle 45^{\\circ}\\ \\Omega$"
                    ],
                    correct: 0
                }
            },
            {
                id: 4,
                title: "例題 10-5 交流電路綜合功率",
                desc: "某單相交流電路，當接於 $v(t) = 10\\sqrt{2}\\sin(377t)\\text{ V}$ 電源電壓時，若產生 $i(t) = 5\\sqrt{2}\\sin(377t - 60^{\\circ})\\text{ A}$ 的電路電流，試求該電路之 (1) $S$ (2) $P$ (3) $Q$。",
                mode1_steps: [
                    { q: "步驟一：提取有效值大小並計算相位角差 $\\theta$？", a: ["$V = 10\\text{ V}, I = 5\\text{ A}, \\theta = 0^{\\circ} - (-60^{\\circ}) = 60^{\\circ}$", "$V = 10\\sqrt{2}\\text{ V}, I = 5\\sqrt{2}\\text{ A}, \\theta = -60^{\\circ}$"], correct: 0 },
                    { q: "步驟二：求出視在功率 $S$ 與平均功率 $P$？", a: ["$S = VI = 50\\text{ VA}, P = VI\\cos\\theta = 10 \\times 5 \\times \\cos 60^{\\circ} = 25\\text{ W}$", "$S = 50\\text{ VA}, P = 50\\text{ W}$"], correct: 0 },
                    { q: "步驟三：求出虛功率 $Q$？", a: ["$Q = VI\\sin\\theta = 10 \\times 5 \\times \\sin 60^{\\circ} = 25\\sqrt{3}\\text{ VAR}$", "$Q = 25\\text{ VAR}$"], correct: 0 }
                ],
                mode2_match: {
                    q: "請選擇本題三項功率綜合答案鏈：",
                    a: [
                        "$S = 50\\text{ VA}, P = 25\\text{ W}, Q = 25\\sqrt{3}\\text{ VAR}$",
                        "$S = 50\\text{ VA}, P = 25\\sqrt{3}\\text{ W}, Q = 25\\text{ VAR}$",
                        "$S = 100\\text{ VA}, P = 50\\text{ W}, Q = 50\\sqrt{3}\\text{ VAR}$"
                    ],
                    correct: 0
                }
            },
            {
                id: 5,
                title: "例題 10-6 純電容電路之電功率",
                desc: "如圖所示之純電容交流電路，若負載 $C = 20\\ \\mu\\text{F}$，當接於 $v(t) = 200\\sqrt{2}\\sin(1000t)\\text{ V}$ 電源電壓時，試求該電路之 (1) $S$ (2) $P$ (3) $Q_C$ (4) $P_{\\max}$ (5) $P_{\\min}$ (6) $f_p$。",
                mode1_steps: [
                    { q: "步驟一：求出容抗 $-jX_C$ 與電流相量 $\\bar{I}$？", a: ["$-jX_C = -j50\\ \\Omega \\rightarrow \\bar{I} = 4\\angle 90^{\\circ}\\text{ A}$", "$-jX_C = -j10\\ \\Omega \\rightarrow \\bar{I} = 20\\angle 90^{\\circ}\\text{ A}$"], correct: 0 },
                    { q: "步驟二：計算各類功率參數，純電容的實功與虛功分別為何？", a: ["$P = 0\\text{ W}, Q_C = VI\\sin(-90^{\\circ}) = -800\\text{ VAR}, S = 800\\text{ VA}$", "$P = 800\\text{ W}, Q_C = 0\\text{ VAR}, S = 800\\text{ VA}$"], correct: 0 },
                    { q: "步驟三：求出功率頻率 $f_p$（配合特殊數字）？", a: ["$f = \\frac{1000}{2\\times 3.14} = 159\\text{ Hz} \\rightarrow f_p = 2f = 318\\text{ Hz}$", "$f_p = 1000\\text{ Hz}$"], correct: 0 }
                ],
                mode2_match: {
                    q: "請選擇純電容電路完整死記數值結構：",
                    a: [
                        "$S = 800\\text{ VA}, P = 0\\text{ W}, Q_C = -800\\text{ VAR}, P_{\\max} = 800\\text{ W}, P_{\\min} = -800\\text{ W}, f_p = 318\\text{ Hz}$",
                        "$S = 800\\text{ VA}, P = 800\\text{ W}, Q_C = 0\\text{ VAR}, P_{\\max} = 800\\text{ W}, P_{\\min} = 0\\text{ W}, f_p = 159\\text{ Hz}$"
                    ],
                    correct: 0
                }
            },
            {
                id: 6,
                title: "例題 10-8 功率因數三角形反推",
                desc: "某單相交流電路，當電源供應 $S = 15\\text{ kVA}$ 之電力時，若電路的虛功率 $Q = 9\\text{ kVAR}$（電容性），試求該電路之功率因數 $PF$。",
                mode1_steps: [
                    { q: "步驟一：利用畢氏定理求出實功率 $P$ 數值？", a: ["$P = \\sqrt{S^2 - Q^2} = \\sqrt{15^2 - 9^2} = 12\\text{ kW}$", "$P = 15 - 9 = 6\\text{ kW}$"], correct: 0 },
                    { q: "步驟二：計算功率因數並判定其超前或滯後？", a: ["$PF = \\frac{P}{S} = \\frac{12}{15} = 0.8$（因電容性，故為超前功因）", "$PF = \\frac{12}{15} = 0.8$（因電容性，故為滯後功因）"], correct: 0 }
                ],
                mode2_match: {
                    q: "請選擇本題正確的公式推導與最終答案：",
                    a: [
                        "$P = \\sqrt{15^2 - 9^2} = 12\\text{ kW} \\rightarrow PF = \\frac{12}{15} = 0.8$（超前功因）",
                        "$P = 12\\text{ kW} \\rightarrow PF = \\frac{12}{15} = 0.8$（滯後功因）",
                        "$PF = \\frac{Q}{S} = \\frac{9}{15} = 0.6$（超前功因）"
                    ],
                    correct: 0
                }
            },
            {
                id: 7,
                title: "例題 10-9 串並聯功率因數大魔王關係式",
                desc: "已知一負載具有 $R = 6\\ \\Omega$ 與 $X_L = 8\\ \\Omega$。試求其 (1) 串聯時之功率因數 $PF_s$ (2) 並聯時之功率因數 $PF_p$ (3) $PF_s$ 與 $PF_p$ 之關係為何？",
                mode1_steps: [
                    { q: "步驟一：計算串聯電路之功率因數 $PF_s$？", a: ["$PF_s = \\frac{R}{Z_s} = \\frac{6}{\\sqrt{6^2 + 8^2}} = 0.6$", "$PF_s = 0.8$"], correct: 0 },
                    { q: "步驟二：計算並聯電路之功率因數 $PF_p$？", a: ["$PF_p = \\frac{G}{Y} = \\frac{8}{\\sqrt{6^2 + 8^2}} = 0.8$", "$PF_p = 0.6$"], correct: 0 },
                    { q: "步驟三：寫出兩者串並聯公式 10-12 的終極核心關係式？", a: ["$PF_s^2 + PF_p^2 = 1$", "$PF_s + PF_p = 1.4$"], correct: 0 }
                ],
                mode2_match: {
                    q: "請選擇本大魔王題型正確的數據結論與公式關係式：",
                    a: [
                        "$PF_s = 0.6,\\, PF_p = 0.8,\\, \\text{關係式：} PF_s^2 + PF_p^2 = 1$",
                        "$PF_s = 0.8,\\, PF_p = 0.6,\\, \\text{關係式：} PF_s^2 + PF_p^2 = 1$",
                        "$PF_s = 0.6,\\, PF_p = 0.8,\\, \\text{關係式：} PF_s + PF_p = 1.4$"
                    ],
                    correct: 0
                }
            }
        ];

        let currentMode = 1;
        let quizQuestions = [];
        let currentQuestionIdx = 0;
        let currentStepIdx = 0;
        let wrongQuestionsLog = [];
        let totalAnswered = 0;
        let totalCorrect = 0;

        function startQuiz(mode) {
            currentMode = mode;
            quizQuestions = [...allQuestions];
            currentQuestionIdx = 0;
            currentStepIdx = 0;
            wrongQuestionsLog = [];
            totalAnswered = 0;
            totalCorrect = 0;
            
            document.getElementById("menu-view").classList.remove("active");
            document.getElementById("result-view").classList.remove("active");
            document.getElementById("quiz-view").classList.add("active");
            
            showQuestion();
        }

        function showQuestion() {
            if (currentQuestionIdx >= quizQuestions.length) {
                showResult();
                return;
            }

            const qData = quizQuestions[currentQuestionIdx];
            document.getElementById("question-index").innerText = `題目 ${currentQuestionIdx + 1} / ${quizQuestions.length}`;
            document.getElementById("score-track").innerText = `目前正確率: ${totalAnswered === 0 ? 100 : Math.round((totalCorrect / totalAnswered) * 100)}%`;
            document.getElementById("progress-fill").style.width = `${((currentQuestionIdx) / quizQuestions.length) * 100}%`;
            
            document.getElementById("question-title").innerHTML = `<span class="important-text">${qData.title}</span>`;
            document.getElementById("question-content").innerHTML = qData.desc;
            document.getElementById("feedback-hint").className = "hint";
            document.getElementById("next-btn").style.display = "none";

            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            if (currentMode === 1) {
                const stepData = qData.mode1_steps[currentStepIdx];
                const stepTitle = document.createElement("p");
                stepTitle.style.fontWeight = "bold";
                stepTitle.innerHTML = stepData.q;
                optionsContainer.appendChild(stepTitle);

                stepData.a.forEach((optionText, index) => {
                    const btn = document.createElement("button");
                    btn.className = "btn";
                    btn.innerHTML = optionText;
                    btn.onclick = () => checkAnswerMode1(index, stepData.correct);
                    optionsContainer.appendChild(btn);
                });
            } else {
                const matchData = qData.mode2_match;
                const matchTitle = document.createElement("p");
                matchTitle.style.fontWeight = "bold";
                matchTitle.innerHTML = matchData.q;
                optionsContainer.appendChild(matchTitle);

                matchData.a.forEach((optionText, index) => {
                    const btn = document.createElement("button");
                    btn.className = "btn";
                    btn.innerHTML = optionText;
                    btn.onclick = () => checkAnswerMode2(index, matchData.correct);
                    optionsContainer.appendChild(btn);
                });
            }
            
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function checkAnswerMode1(selectedIndex, correctIndex) {
            totalAnswered++;
            const feedback = document.getElementById("feedback-hint");
            const qData = quizQuestions[currentQuestionIdx];
            
            if (selectedIndex === correctIndex) {
                totalCorrect++;
                feedback.innerText = "正確";
                feedback.className = "hint correct";
                
                setTimeout(() => {
                    currentStepIdx++;
                    if (currentStepIdx < qData.mode1_steps.length) {
                        showQuestion();
                    } else {
                        currentStepIdx = 0;
                        currentQuestionIdx++;
                        showQuestion();
                    }
                }, 600);
            } else {
                feedback.innerText = "錯誤，步驟邏輯不符，請重新選取。";
                feedback.className = "hint wrong";
                logWrongQuestion(qData);
            }
        }

        function checkAnswerMode2(selectedIndex, correctIndex) {
            totalAnswered++;
            const feedback = document.getElementById("feedback-hint");
            const qData = quizQuestions[currentQuestionIdx];
            
            if (selectedIndex === correctIndex) {
                totalCorrect++;
                feedback.innerText = "正確";
                feedback.className = "hint correct";
                document.getElementById("next-btn").style.display = "block";
            } else {
                feedback.innerText = "錯誤，公式或答案數值不符，請重新選取。";
                feedback.className = "hint wrong";
                logWrongQuestion(qData);
            }
        }

        function logWrongQuestion(q) {
            if (!wrongQuestionsLog.some(item => item.id === q.id)) {
                wrongQuestionsLog.push(q);
            }
        }

        function nextQuestion() {
            currentQuestionIdx++;
            showQuestion();
        }

        function showResult() {
            document.getElementById("quiz-view").classList.remove("active");
            document.getElementById("result-view").classList.add("active");

            const rate = totalAnswered === 0 ? 0 : Math.round((totalCorrect / totalAnswered) * 100);
            document.getElementById("accuracy-rate").innerText = `${rate}%`;

            const comment = document.getElementById("result-comment");
            const retryBtn = document.getElementById("retry-wrong-btn");

            if (rate === 100) {
                comment.innerHTML = "所有題型公式與死記數據已完全掌握。";
                retryBtn.style.display = "none";
            } else {
                comment.innerHTML = `尚有 <span class="important-text">${wrongQuestionsLog.length}</span> 題錯誤題型需要修正。`;
                retryBtn.style.display = "block";
            }
        }

        function retryWrongQuestions() {
            quizQuestions = [...wrongQuestionsLog];
            wrongQuestionsLog = [];
            currentQuestionIdx = 0;
            currentStepIdx = 0;
            totalAnswered = 0;
            totalCorrect = 0;

            document.getElementById("result-view").classList.remove("active");
            document.getElementById("quiz-view").classList.add("active");
            showQuestion();
        }

        function backToMenu() {
            document.getElementById("result-view").classList.remove("active");
            document.getElementById("menu-view").classList.add("active");
        }

        // 番茄鐘計時模組邏輯
        let timerInstance = null;
        let timeRemaining = 25 * 60;
        let isBreak = false;
        let timerRunning = true;

        function updateTimerDisplay() {
            const mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const secs = (timeRemaining % 60).toString().padStart(2, '0');
            if (!isBreak) {
                document.getElementById("time-display").innerText = `${mins}:${secs}`;
            } else {
                document.getElementById("break-time-display").innerText = `${mins}:${secs}`;
            }
        }

        function startTimerLifecycle() {
            if (timerInstance) clearInterval(timerInstance);
            timerInstance = setInterval(() => {
                if (timerRunning && timeRemaining > 0) {
                    timeRemaining--;
                    updateTimerDisplay();
                    
                    if (timeRemaining === 0) {
                        if (!isBreak) {
                            isBreak = true;
                            timeRemaining = 5 * 60;
                            document.getElementById("timer-label").innerText = "休息時間";
                            document.getElementById("break-modal").style.display = "flex";
                        } else {
                            closeBreakModal();
                        }
                    }
                }
            }, 1000);
        }

        function toggleTimer() {
            timerRunning = !timerRunning;
        }

        function resetTimer() {
            isBreak = false;
            timerRunning = true;
            timeRemaining = 25 * 60;
            document.getElementById("timer-label").innerText = "專注時間";
            updateTimerDisplay();
        }

        function skipTimer() {
            clearInterval(timerInstance);
            document.getElementById("time-display").innerText = "關閉";
        }

        function closeBreakModal() {
            document.getElementById("break-modal").style.display = "none";
            isBreak = false;
            timeRemaining = 25 * 60;
            document.getElementById("timer-label").innerText = "專注時間";
            updateTimerDisplay();
        }

        startTimerLifecycle();
    </script>
</body>
</html>
